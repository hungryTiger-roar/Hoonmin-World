spring.application.name=hm_world

# 데이터소스 (HMworld 스키마 기준)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/HMworld?serverTimezone=Asia/Seoul&useUnicode=yes&characterEncoding=UTF-8
spring.datasource.username=ssafy
spring.datasource.password=ssafy

# MyBatis 설정
mybatis.mapper-locations=mapper/**/*.xml
mybatis.type-aliases-package=com.ssafy.hm.dto

# Swagger UI 경로: http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/index.html

# logging
logging.level.com.ssafy=debug

spring.devtools.livereload.enabled=true
spring.devtools.remote.restart.enabled=true

spring.servlet.multipart.maxFileSize=50MB
spring.servlet.multipart.maxRequestSize=50MB

# must ends with '/'
uploadPath: C:/Temp/upload/
